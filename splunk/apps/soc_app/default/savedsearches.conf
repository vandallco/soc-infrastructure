# =====================================================
#  savedsearches.conf — Correlation Searches del SOC
#  Todas alimentan `notable` events + webhook a TheHive
# =====================================================

# ---------- UC-001: SSH Brute Force ----------
[SOC - UC-001 SSH Brute Force]
search = index=soc_endpoints sourcetype=linux:auth status=Failed \
  | bin _time span=5m \
  | stats count dc(user) as unique_users values(user) as users by _time src_ip host \
  | where count >= 10 \
  | eval mitre_technique="T1110.001", severity="high"
dispatch.earliest_time = -15m
dispatch.latest_time   = now
cron_schedule = */5 * * * *
enableSched = 1
alert.suppress = 1
alert.suppress.period = 30m
alert.severity = 4
action.webhook = 1
action.webhook.param.url = http://thehive:9000/api/alert
description = Detecta 10+ intentos fallidos SSH desde una misma IP en 5 minutos.

# ---------- UC-002: Lateral Movement SMB ----------
[SOC - UC-002 Lateral Movement SMB]
search = index=soc_windows source="WinEventLog:Security" EventCode=4624 logon_type=3 \
  | bin _time span=10m \
  | stats dc(host) as targets values(host) as target_list by _time src_ip target_user \
  | where targets >= 5 \
  | eval mitre_technique="T1021.002", severity="high"
cron_schedule = */10 * * * *
dispatch.earliest_time = -30m
enableSched = 1
alert.severity = 4
description = Usuario conectándose por SMB/NTLM a >=5 hosts en 10 minutos.

# ---------- UC-003: PowerShell ofuscado ----------
[SOC - UC-003 PowerShell EncodedCommand]
search = index=soc_windows sourcetype=sysmon:operational EventCode=1 \
  ("powershell.exe" OR "pwsh.exe") \
  ("-EncodedCommand" OR "-enc " OR "FromBase64String" OR "IEX(" OR "Invoke-Expression") \
  | eval mitre_technique="T1059.001", severity="high" \
  | table _time host user image cmdline mitre_technique
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
enableSched = 1
alert.severity = 4
description = Ejecución de PowerShell con codificación / ofuscación.

# ---------- UC-004: Exfiltración DNS ----------
[SOC - UC-004 DNS Tunneling]
search = index=soc_suricata sourcetype=suricata:eve suricata.event_type=dns \
  | eval qlen=len('suricata.dns.rrname') \
  | where qlen > 60 \
  | stats count avg(qlen) as avg_len by src_ip suricata.dns.rrname \
  | where count > 20 \
  | eval mitre_technique="T1048.003", severity="high"
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
enableSched = 1
alert.severity = 4
description = Queries DNS anormalmente largas: posible tunneling / exfiltración.

# ---------- UC-005: Persistencia Scheduled Task ----------
[SOC - UC-005 Scheduled Task Persistence]
search = index=soc_windows source="WinEventLog:Security" (EventCode=4698 OR EventCode=4702) \
  | eval mitre_technique="T1053.005", severity="medium" \
  | table _time host user TaskName cmdline mitre_technique
cron_schedule = */15 * * * *
dispatch.earliest_time = -1h
enableSched = 1
alert.severity = 3
description = Creación/modificación de tarea programada — posible persistencia.

# ---------- UC-006: Ransomware canary ----------
[SOC - UC-006 Ransomware Canary File Mod]
search = index=soc_endpoints (source=*canary* OR path=*canary*) \
  ("write" OR "delete" OR "rename") \
  | stats count by host user path \
  | where count > 3 \
  | eval mitre_technique="T1486", severity="critical"
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
enableSched = 1
alert.severity = 5
description = Modificación repetida de archivos canary → ransomware sospechoso.

# ---------- UC-007: Beacon C2 vs IoC MISP ----------
[SOC - UC-007 C2 Beacon vs MISP IoC]
search = index=soc_suricata sourcetype=suricata:eve suricata.event_type=http \
  | rename suricata.dest_ip as dest_ip suricata.http.hostname as host_header \
  | lookup misp_iocs.csv value AS dest_ip OUTPUT threat_type category ioc_confidence \
  | where isnotnull(threat_type) \
  | eval mitre_technique="T1071.001", severity="critical"
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
enableSched = 1
alert.severity = 5
description = Tráfico HTTP hacia IP/host presente en feed MISP.

# ---------- UC-008: Discovery Nmap ----------
[SOC - UC-008 Internal Nmap Scan]
search = index=soc_suricata sourcetype=suricata:eve suricata.event_type=alert \
  suricata.alert.signature_id=9000001 \
  | stats count dc(suricata.dest_port) as ports by src_ip \
  | where ports >= 15 \
  | eval mitre_technique="T1046", severity="medium"
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
enableSched = 1
alert.severity = 3
description = Escaneo Nmap interno detectado por Suricata.
