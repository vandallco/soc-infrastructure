title: Canary File Modified
id: 9df0a1f1-ee6d-45b3-8238-f90028e12783
name: soc_lab_canary_file_event
status: stable
description: A process wrote to a decoy (canary) file, base event for UC-006.
author: SOC Lab
date: 2026-09-28
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\canary\'
  condition: selection
falsepositives:
  - Backup software touching the canary directory
level: medium
