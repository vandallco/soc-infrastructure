# =====================================================
#  props.conf — parsers para las fuentes del SOC
# =====================================================

[suricata:eve]
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 0
SHOULD_LINEMERGE = false
category = Structured
description = Suricata EVE JSON
disabled = false
pulldown_type = 1

[linux:auth]
SHOULD_LINEMERGE = false
TIME_PREFIX =
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 25
EXTRACT-src_ip = from\s+(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})
EXTRACT-user   = for\s+(?:invalid user\s+)?(?<user>\S+)
REPORT-auth    = auth_transforms

[WinEventLog:Security]
category = Windows
description = Windows Security event log
disabled = false
EXTRACT-target_user = Account Name:\s+(?<target_user>\S+)
EXTRACT-src_ip      = Source Network Address:\s+(?<src_ip>\S+)
EXTRACT-logon_type  = Logon Type:\s+(?<logon_type>\d+)

[sysmon:operational]
category = Windows
disabled = false
EXTRACT-image = Image:\s+(?<image>[^\r\n]+)
EXTRACT-cmdline = CommandLine:\s+(?<cmdline>[^\r\n]+)
EXTRACT-parent_image = ParentImage:\s+(?<parent_image>[^\r\n]+)
