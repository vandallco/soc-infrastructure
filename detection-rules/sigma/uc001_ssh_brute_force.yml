title: SSH Brute Force (SOC Lab UC-001)
id: 9f2b3d1a-1111-4c4c-8888-000000000001
status: stable
description: Detects 10+ failed SSH auth attempts from the same source in 5 minutes.
author: SOC Lab
date: 2026/09/01
references:
  - https://attack.mitre.org/techniques/T1110/001/
logsource:
  product: linux
  service: auth
detection:
  selection:
    program: sshd
    message|contains: 'Failed password'
  timeframe: 5m
  condition: selection | count() by src_ip > 9
level: high
tags:
  - attack.credential_access
  - attack.t1110.001
falsepositives:
  - Vulnerability scanners
  - Users forgetting password
