data_dir = "/var/lib/vector"

# ---------- Sources ----------
[sources.suricata_eve]
type = "file"
include = ["/var/log/suricata/eve.json"]
read_from = "beginning"
ignore_older_secs = 86400

# ---------- Transforms ----------
[transforms.parse_eve]
type = "remap"
inputs = ["suricata_eve"]
source = '''
. = parse_json!(.message)
.sourcetype = "suricata:eve"
.index = "soc_suricata"
'''

# ---------- Sink: Splunk HEC ----------
[sinks.splunk_hec]
type = "splunk_hec_logs"
inputs = ["parse_eve"]
endpoint = "${SPLUNK_HEC_URL}"
default_token = "${SPLUNK_HEC_TOKEN}"
index = "soc_suricata"
source = "suricata"
sourcetype = "suricata:eve"
compression = "gzip"
tls.verify_certificate = false
encoding.codec = "json"

[sinks.splunk_hec.batch]
max_events = 100
timeout_secs = 5
